name: Run_test

on: 
  push: 
   branches: [ master ]

jobs: 
  test: 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with: 
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pytest

    - name: Run test
      run: python -m pytest tests/ -v